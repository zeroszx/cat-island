# Membangun installer Windows (NSIS) di server GitHub.
# Berjalan otomatis setiap push ke main, atau manual dari tab Actions ("Run workflow").
# Hasil: artefak "Cat-Island-Setup" berisi Cat-Island-Setup-<versi>.exe
name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Bangun installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # tanpa sertifikat code-signing

      - uses: actions/upload-artifact@v4
        with:
          name: Cat-Island-Setup
          path: dist/*.exe
          if-no-files-found: error
