<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src https://www.youtube.com">
<title>Cat Island – Mode Panggung</title>
<style>
  :root { --accent: #f2cf7f; --D: 71vmin; --ease: cubic-bezier(.2, .9, .25, 1.15); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none;
    font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; color: #f4ecdc; }

  /* latar: tangkapan layar diblur (±40%) + sedikit gelap agar lingkaran menonjol */
  #bg { position: fixed; inset: -48px; background: #111 center / cover no-repeat; filter: blur(14px) saturate(1.08);
    opacity: 0; transition: opacity .45s ease; }
  #shade { position: fixed; inset: 0; opacity: 0; transition: opacity .45s ease;
    background: radial-gradient(circle at 50% 48%, rgba(0,0,0,.12) 0, rgba(0,0,0,.42) 75%); }
  body.on #bg, body.on #shade { opacity: 1; }

  /* panggung: canvas visualizer lebih besar dari lingkaran, keduanya pas di tengah layar */
  #stage { position: fixed; left: 50%; top: 48.2%; width: calc(var(--D) * 1.2); height: calc(var(--D) * 1.2);
    transform: translate(-50%, -50%) scale(.9); opacity: 0; transition: transform .6s var(--ease), opacity .4s ease; }
  body.on #stage { transform: translate(-50%, -50%); opacity: 1; }
  #ring { position: absolute; inset: 0; width: 100%; height: 100%; }

  #disc { position: absolute; left: 50%; top: 50%; width: var(--D); height: var(--D); transform: translate(-50%, -50%);
    border-radius: 50%; overflow: hidden; background: #0b0b0d; isolation: isolate;
    box-shadow: 0 0 0 2px rgba(244,236,220,.14), 0 30px 90px rgba(0,0,0,.55); }
  #art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;
    animation: drift 28s ease-in-out infinite alternate; }
  #art:not([src]) { display: none; }
  /* video menutupi lingkaran, pas di tengah. Ukuran & skala diatur stage.js (fitVideo) sesuai
     rasio asli video, lalu diperbesar bila ada black bar tertanam. Bawaan: 16:9 setinggi lingkaran. */
  #vid { position: absolute; left: 50%; top: 50%; width: 177.78%; height: 100%;
    transform: translate(-50%, -50%) scale(1.02); opacity: 0; transition: opacity .9s ease; }
  #vid.on { opacity: 1; }
  #vid iframe { width: 100%; height: 100%; border: 0; pointer-events: none; display: block; }
  #shield { position: absolute; inset: 0; border-radius: 50%; cursor: pointer; }
  #state { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: rgba(0,0,0,.45); display: grid; place-items: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #state svg { width: 26px; height: 26px; fill: #f4ecdc; }
  body.paused #state { opacity: 1; }

  #meta { position: fixed; left: 50%; bottom: 2.4vh; transform: translateX(-50%);
    text-align: center; max-width: 70vw; opacity: 0; transition: opacity .5s ease .15s; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  body.on #meta { opacity: 1; }
  #title { display: block; font-size: 2.3vmin; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { display: block; margin-top: .4vmin; font-size: 1.6vmin; opacity: .7; }
  #hint { position: fixed; left: 50%; top: 2.2vh; transform: translateX(-50%); font-size: 12px; opacity: 0;
    color: rgba(244,236,220,.6); transition: opacity .5s ease .4s; }
  body.on #hint { opacity: 1; }
  /* lama istirahat sejak Mode Panggung dibuka (pojok kanan atas, jauh dari lingkaran & teks) */
  /* hitung mundur Pomodoro dari widget (mode, sisa waktu, jalan/jeda), pojok kanan atas */
  #rest { --pc: #6fd6a8; position: fixed; top: 2.2vh; right: 2.2vw; display: flex; align-items: center; gap: 1vmin;
    padding: .9vmin 1.6vmin .9vmin 1.2vmin; border-radius: 999px; background: rgba(0,0,0,.32); overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(244,236,220,.12); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .5s ease .3s; }
  body.on #rest { opacity: 1; }
  #rest svg { width: 2.4vmin; height: 2.4vmin; fill: none; stroke: var(--pc); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #rest span { font-size: 1.4vmin; opacity: .7; }
  #restTime { font-size: 2.4vmin; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  #rest .i-focus, #rest.focus .i-break { display: none; }
  #rest.focus .i-focus { display: block; }
  #rest.paused #restTime { opacity: .55; }
  #rest.paused span::after { content: ' · dijeda'; }
  #restBar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--pc);
    transform-origin: left; transform: scaleX(0); opacity: .85; }
  kbd { font: inherit; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.1); }

  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.12); } }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="shade"></div>
  <div id="stage">
    <canvas id="ring"></canvas>
    <div id="disc">
      <img id="art" alt="">
      <div id="vid"></div>
      <div id="shield"></div>
      <div id="state"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
  </div>
  <div id="meta"><span id="title"></span><span id="artist"></span></div>
  <div id="rest">
    <svg class="i-break" viewBox="0 0 24 24"><path d="M4 9h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c-.6.8-.6 1.7 0 2.5M12 3c-.6.8-.6 1.7 0 2.5"/></svg>
    <svg class="i-focus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>
    <span id="restLabel">Istirahat</span><b id="restTime">5:00</b>
    <i id="restBar"></i>
  </div>
  <div id="hint"><kbd>Esc</kbd> / klik di luar lingkaran: keluar · <kbd>Spasi</kbd>: putar/jeda · <kbd>←</kbd> <kbd>→</kbd>: lagu · <kbd>R</kbd>: RGB</div>

  <script src="src/visualizer.js"></script>
  <script src="src/stage.js"></script>
</body>
</html>
